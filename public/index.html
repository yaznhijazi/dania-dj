function viewMiniPlayer(){
  const p = playlist();
  if (!p || !p.songs.length) return '';
  const active = songById(state.activeSongId) || p.songs[0];
  const isMix = state.player.kind === 'mix';
  const playing = state.player.kind && (isMix || state.player.id === active.id);
  const total = isMix ? state.player.total : songDuration(active);
  const pos = state.player.kind ? state.player.pos : 0;
  const pct = total > 0 ? clamp(pos / total * 100, 0, 100) : 0;
  const title = isMix ? p.name + ' — full mix' : active.title;
  const sub = isMix ? p.songs.length + ' songs, crossfaded' : active.artist;
  return '<div class="miniplayer">' +
    '<div style="display:flex;align-items:center;gap:12px;width:220px;flex:0 0 auto">' +
      '<div style="width:42px;height:42px;border-radius:8px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:16px;flex:0 0 auto">&#9835;</div>' +
      '<div style="min-width:0"><div style="font-size:13px;font-weight:600" class="ell">' + esc(title) + '</div>' +
      '<div style="font-size:11.5px;color:var(--muted)" class="ell">' + esc(sub) + '</div></div>' +
    '</div>' +
    '<button class="mp-round" data-act="prevSong" title="Previous">&#9664;&#9664;</button>' +
    '<button class="mp-main" data-act="' + (isMix ? 'togglePlayMix' : 'togglePlaySong') + '" data-id="' + active.id + '">' + (playing ? PAUSE : PLAY) + '</button>' +
    '<button class="mp-round" data-act="nextSong" title="Next">&#9654;&#9654;</button>' +
    '<div class="bar" id="mp-bar" data-seek="1"><div id="mp-fill" style="width:' + pct + '%"></div></div>' +
    '<div style="font-size:11.5px;color:var(--muted);width:96px;text-align:right;flex:0 0 auto" id="mp-time">' +
      fmt(pos) + ' / ' + fmt(total) + '</div>' +
    '<button class="btn sm ghost" data-act="togglePlayMix" style="flex:0 0 auto">' + (isMix ? 'Stop mix' : 'Full mix') + '</button>' +
  '</div>';
}

function render(){
  const inPl = state.screen !== 'dashboard' && playlist();
  const p = playlist();
  let main = '';
  if (state.screen === 'dashboard' || !p) main = viewDashboard();
  else if (state.screen === 'editor') main = viewEditor();
  else if (state.screen === 'track') main = viewTrack();
  else if (state.screen === 'transition') main = viewTransition();
  else if (state.screen === 'export') main = viewExport();

  const songsActive = ['editor', 'track', 'transition'].includes(state.screen);
  $('root').innerHTML =
    '<div class="app">' +
      '<div class="topbar">' +
        '<div class="logo" data-act="goDashboard"><div class="logo-mark">D</div><div class="logo-txt">Dania DJ</div></div>' +
        (inPl ? '<div style="font-size:13px;color:var(--muted)" class="ell">' + esc(p.name) + '</div>' : '') +
      '</div>' +
      '<div class="body">' +
        (inPl ?
          '<div class="sidebar">' +
            '<div>' +
              '<input class="edit-inline" data-pl-field="name" value="' + esc(p.name) + '" placeholder="Playlist name" ' +
                'style="font-family:Lora,serif;font-weight:600;font-size:17px;line-height:1.3">' +
              '<input class="edit-inline" data-pl-field="date" value="' + esc(p.date) + '" placeholder="Event date" ' +
                'style="font-size:12px;color:var(--muted);margin-top:6px">' +
            '</div>' +
            '<div style="display:flex;flex-direction:column;gap:4px">' +
              '<div class="nav-item ' + (songsActive ? 'active' : '') + '" data-act="goSongs">Songs</div>' +
              '<div class="nav-item ' + (state.screen === 'export' ? 'active' : '') + '" data-act="goExport">Export</div>' +
            '</div>' +
            '<div style="margin-top:auto;font-size:13px;color:var(--muted);cursor:pointer;padding:8px 10px" data-act="goDashboard">&larr; All Playlists</div>' +
          '</div>' : '') +
        '<div class="main">' + main + '</div>' +
      '</div>' +
      (inPl ? viewMiniPlayer() : '') +
    '</div>';
  save();   // every navigation also checkpoints where we are
  $('layer').innerHTML = viewUpload() + (state.busy ?
    '<div class="overlay"><div class="modal" style="width:320px;display:flex;align-items:center;gap:12px">' +
      '<div class="spinner" style="border-color:rgba(0,0,0,.15);border-top-color:var(--accent)"></div>' +
      '<div style="font-size:13.5px">' + esc(state.busy) + '</div></div></div>' : '');
  wire();
}

/* fine-grained repaint during playback (avoids a full re-render 10x/sec) */
function paintProgress(){
  const isMix = state.player.kind === 'mix';
  const p = playlist(); if (!p) return;
  const total = isMix ? state.player.total : state.player.total;
  const pct = total > 0 ? clamp(state.player.pos / total * 100, 0, 100) : 0;
  const fill = $('mp-fill'); if (fill) fill.style.width = pct + '%';
  const t = $('mp-time'); if (t) t.textContent = fmt(state.player.pos) + ' / ' + fmt(total);
  const head = $('wave-head');
  if (head && state.screen === 'track' && state.player.kind === 'solo'){
    const s = songById(state.currentSongId);
    if (s){
      head.style.display = 'block';
      head.style.left = ((s.start + state.player.pos) / s.duration * 100) + '%';
    }
  } else if (head) head.style.display = 'none';
}
function paintExportProgress(){
  const b = $('exp-bar'); if (b) b.style.width = state.exportProgress + '%';
  const p = $('exp-pct'); if (p) p.textContent = Math.round(state.exportProgress) + '%';
  const l = $('exp-label'); if (l) l.textContent = (state.exportLabel || 'Rendering') + '…';
}

/* ==========================================================================
   Event wiring
   ========================================================================== */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  const bg = e.target.closest('[data-bg]');
  // a click inside the modal must not close it via the backdrop
  if (bg && e.target.closest('[data-stopclick]') && el === bg) return;
  if (!el) return;
  const act = el.dataset.act;
  e.stopPropagation();

  switch (act){
    case 'goDashboard': actions.goDashboard(); render(); break;
    case 'openPlaylist': actions.openPlaylist(el.dataset.id); render(); break;
    case 'newPlaylist': actions.newPlaylist(); render(); break;
    case 'renamePlaylist': actions.renamePlaylist(el.dataset.id); render(); break;
    case 'deletePlaylist': actions.deletePlaylist(el.dataset.id); break;
    case 'goSongs': actions.goSongs(); render(); break;
    case 'goExport': actions.goExport(); render(); break;
    case 'openTrack': actions.openTrack(el.dataset.id); render(); break;
    case 'openTransition': actions.openTransition(Number(el.dataset.i)); render(); break;
    case 'duplicateSong': actions.duplicateSong(el.dataset.id); render(); break;
    case 'removeSong': actions.removeSong(el.dataset.id); break;
    case 'splitSong': actions.splitSong(el.dataset.id); break;
    case 'editEndpoint': state.editEndpoint = true; render(); break;
    case 'cropToSelection': actions.cropToSelection(); break;
    case 'cutSelection': actions.cutSelection(); break;
    case 'clearCuts': actions.clearCuts(); break;
    case 'removeCut': actions.removeCut(Number(el.dataset.i)); break;
    case 'resetTrim': actions.resetTrim(); break;
    case 'applyToAll': actions.applyToAll(); break;
    case 'crossfadeAll': actions.crossfadeAll(); render(); break;
    case 'openUpload': actions.openUpload(); render(); break;
    case 'closeUpload': actions.closeUpload(); render(); break;
    case 'setTab': actions.setTab(el.dataset.t); render(); break;
    case 'selectFormat': actions.selectFormat(el.dataset.f); render(); break;
    case 'togglePlaySong': actions.togglePlaySong(el.dataset.id); break;
    case 'togglePlayMix': actions.togglePlayMix(); break;
    case 'previewTransition': actions.previewTransition(); break;
    case 'prevSong': actions.prevSong(); break;
    case 'nextSong': actions.nextSong(); break;
    case 'startExport': actions.startExport(); break;
    case 'downloadExport': actions.downloadExport(); break;
    case 'importFromUrl': importFromUrl(el.dataset.mode || 'download'); break;
    case 'setCurve': {
      const p = playlist(); const s = p.songs[Math.min(state.transitionIndex, p.songs.length - 2)];
      s.curve = el.dataset.c; save(); render(); break;
    }
  }
});

function wire(){
  // sliders: live label update, commit on release
  document.querySelectorAll('[data-slider]').forEach((inp) => {
    const key = inp.dataset.slider;
    const lbl = inp.dataset.label ? $(inp.dataset.label) : null;
    inp.addEventListener('input', () => {
      if (lbl) lbl.textContent = inp.value;
      const id = inp.dataset.target || state.currentSongId;
      updateSong(id, { [key]: Number(inp.value) });
    });
    inp.addEventListener('change', () => { render(); });
  });
  const sel = document.querySelector('[data-select="eq"]');
  if (sel) sel.addEventListener('change', () => { updateSong(state.currentSongId, { eq: sel.value }); stopAll(); render(); });
  const chk = document.querySelector('[data-check="normalize"]');
  if (chk) chk.addEventListener('change', () => { updateSong(state.currentSongId, { normalize: chk.checked }); render(); });

  // inline renaming: song title/artist, playlist name/date, export file name.
  // Enter commits (blur fires change); blank reverts rather than wiping the name.
  const commitOnEnter = (inp) => inp.addEventListener('keydown', (e) => {
    if (e.key === 'Enter'){ e.preventDefault(); inp.blur(); }
    if (e.key === 'Escape'){ inp.value = inp.dataset.prev || inp.value; inp.blur(); }
  });
  document.querySelectorAll('[data-song-field]').forEach((inp) => {
    inp.dataset.prev = inp.value; commitOnEnter(inp);
    inp.addEventListener('change', () => {
      const s = songById(state.currentSongId); if (!s) return;
      const v = inp.value.trim();
      if (!v){ inp.value = s[inp.dataset.songField]; return; }
      updateSong(s.id, { [inp.dataset.songField]: v });
      render();
    });
  });
  document.querySelectorAll('[data-pl-field]').forEach((inp) => {
    inp.dataset.prev = inp.value; commitOnEnter(inp);
    inp.addEventListener('change', () => {
      const p = playlist(); if (!p) return;
      const v = inp.value.trim();
      if (!v){ inp.value = p[inp.dataset.plField]; return; }
      p[inp.dataset.plField] = v; save(); render();
    });
  });
  const expName = document.querySelector('[data-export-name]');
  if (expName){
    commitOnEnter(expName);
    expName.addEventListener('change', () => {
      const p = playlist(); if (!p) return;
      p.exportName = expName.value.trim();     // blank falls back to the playlist name
      save(); render();
    });
  }

  document.querySelectorAll('[data-field]').forEach((inp) => {
    inp.addEventListener('input', () => { state[inp.dataset.field] = inp.value; if (inp.dataset.field === 'ytEndpoint') save(); });
  });

  // upload
  const fi = $('file-input');
  if (fi) fi.addEventListener('change', (e) => { addFiles(e.target.files); e.target.value = ''; });
  const drop = $('drop');
  if (drop){
    ['dragenter', 'dragover'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('hot'); }));
    ['dragleave', 'drop'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('hot'); }));
    drop.addEventListener('drop', (e) => { if (e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });
  }

  wireRows();
  wireWaveform();
  wireSeek();
  paintProgress();
  paintStorage();
}

/* drag-to-reorder */
function wireRows(){
  document.querySelectorAll('[data-row]').forEach((row) => {
    const i = Number(row.dataset.row);
    row.addEventListener('dragstart', (e) => { state.dragIndex = i; e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', String(i)); } catch (err) {} row.classList.add('dragging'); });
    row.addEventListener('dragend', () => { state.dragIndex = null; state.overIndex = null; render(); });
    row.addEventListener('dragover', (e) => { e.preventDefault(); if (state.overIndex !== i){ document.querySelectorAll('.song-row.over').forEach((n) => n.classList.remove('over')); state.overIndex = i; row.classList.add('over'); } });
    row.addEventListener('drop', (e) => {
      e.preventDefault();
      const from = state.dragIndex;
      state.dragIndex = null; state.overIndex = null;
      if (from == null || from === i) { render(); return; }
      const p = playlist();
      const next = p.songs.slice();
      const [moved] = next.splice(from, 1);
      next.splice(i, 0, moved);
      p.songs = next;
      stopAll(); save(); render();
    });
  });
}

/* waveform: trim handles + selection drag */
function wireWaveform(){
  const box = $('wave'); if (!box) return;
  const s = songById(state.currentSongId); if (!s) return;
  const hs = $('h-start'), he = $('h-end'), va = $('veil-a'), vb = $('veil-b');
  const pctOf = (clientX) => { const r = box.getBoundingClientRect(); return clamp((clientX - r.left) / r.width, 0, 1); };

  const startDrag = (which) => (e) => {
    e.preventDefault(); e.stopPropagation();
    box.setPointerCapture && box.setPointerCapture(e.pointerId);
    const move = (ev) => {
      const t = pctOf(ev.clientX) * s.duration;
      if (which === 'start') s.start = clamp(t, 0, s.end - 1);
      else s.end = clamp(t, s.start + 1, s.duration);
      hs.style.left = (s.start / s.duration * 100) + '%';
      he.style.left = (s.end / s.duration * 100) + '%';
      va.style.width = (s.start / s.duration * 100) + '%';
      vb.style.width = (100 - s.end / s.duration * 100) + '%';
      $('lbl-start').textContent = fmt(s.start);
      $('lbl-end').textContent = fmt(s.end);
      $('lbl-trimmed').textContent = fmt(songDuration(s));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      stopAll(); save(); render();
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  hs.addEventListener('pointerdown', startDrag('start'));
  he.addEventListener('pointerdown', startDrag('end'));

  // drag across the body to select a region for removal / split
  box.addEventListener('pointerdown', (e) => {
    if (e.target === hs || e.target === he) return;
    const a = pctOf(e.clientX) * s.duration;
    state.selection = { a, b: a };
    const move = (ev) => { state.selection.b = pctOf(ev.clientX) * s.duration; paintSelection(s); };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      if (Math.abs(state.selection.b - state.selection.a) < 0.1) state.selection = { a: state.selection.a, b: state.selection.a };
      render();
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  });
  function paintSelection(song){
    let el = box.querySelector('.sel');
    if (!el){ el = document.createElement('div'); el.className = 'sel'; box.appendChild(el); }
    const a = Math.min(state.selection.a, state.selection.b), b = Math.max(state.selection.a, state.selection.b);
    el.style.left = (a / song.duration * 100) + '%';
    el.style.width = ((b - a) / song.duration * 100) + '%';
  }
}

/* click the mini-player bar to seek */
function wireSeek(){
  const bar = $('mp-bar'); if (!bar) return;
  bar.addEventListener('click', async (e) => {
    const r = bar.getBoundingClientRect();
    const frac = clamp((e.clientX - r.left) / r.width, 0, 1);
    const p = playlist(); if (!p || !p.songs.length) return;
    if (state.player.kind === 'mix'){
      // capture the target BEFORE stopping — stopAll() clears state.player
      const target = frac * playlistDuration(p);
      stopAll();
      await actions.togglePlayMix(target);
    } else {
      const active = songById(state.activeSongId) || p.songs[0];
      if (active) playSolo(active, frac);
    }
  });
}

window.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;
  if (e.code === 'Space'){ e.preventDefault();
    if (state.player.kind) { stopAll(); render(); }
    else if (state.screen === 'track') actions.togglePlaySong(state.currentSongId);
    else actions.togglePlayMix();
  }
  if (e.key === 'Escape'){ if (state.uploadOpen){ state.uploadOpen = false; render(); } }
});
window.addEventListener('beforeunload', () => { try { localStorage.setItem(LS_KEY, JSON.stringify(serializable())); } catch (e) {} });

/* ---------- boot ---------- */
load();
render();
</script>
</body>
